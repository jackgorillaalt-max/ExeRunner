name: Build EXE Runner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p ExeRunner/app/src/main/java/com/exerunner/app
          mkdir -p ExeRunner/app/src/main/res/layout
          mkdir -p ExeRunner/app/src/main/res/values

          cat > ExeRunner/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ExeRunner"
          include(":app")
          EOF

          cat > ExeRunner/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > ExeRunner/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.exerunner.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.exerunner.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          cat > ExeRunner/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/Theme.ExeRunner"
                  android:label="EXE Runner">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > ExeRunner/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="Theme.ExeRunner"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#101116</item>
                  <item name="android:navigationBarColor">#101116</item>

              </style>

          </resources>
          EOF

          cat > ExeRunner/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#101116">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="28dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="EXE Runner"
                      android:textColor="#FFFFFF"
                      android:textSize="32sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Windows programs on your Chromebook"
                      android:textColor="#A8ACB8"
                      android:textSize="15sp"/>

                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="28dp"
                      app:cardBackgroundColor="#191B23"
                      app:cardCornerRadius="18dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <TextView
                              android:id="@+id/fileName"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="No EXE selected"
                              android:textColor="#FFFFFF"
                              android:textSize="18sp"
                              android:textStyle="bold"/>

                          <TextView
                              android:id="@+id/fileInfo"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="8dp"
                              android:text="Choose a Windows .exe file to begin."
                              android:textColor="#A8ACB8"
                              android:textSize="14sp"/>

                      </LinearLayout>

                  </com.google.android.material.card.MaterialCardView>

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/selectButton"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="20dp"
                      android:text="SELECT EXE"
                      android:textSize="16sp"/>

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/runButton"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="12dp"
                      android:enabled="false"
                      android:text="RUN"
                      android:textSize="16sp"/>

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="24dp"
                      android:text="Status: Waiting for an EXE"
                      android:textColor="#7FE29B"
                      android:textSize="14sp"/>

              </LinearLayout>

          </ScrollView>
          EOF

          cat > ExeRunner/app/src/main/java/com/exerunner/app/MainActivity.kt <<'EOF'
          package com.exerunner.app

          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import com.exerunner.app.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var selectedUri: Uri? = null

              private val pickExe =
                  registerForActivityResult(
                      ActivityResultContracts.OpenDocument()
                  ) { uri ->

                      if (uri == null) return@registerForActivityResult

                      selectedUri = uri

                      binding.fileName.text =
                          getFileName(uri) ?: "Selected EXE"

                      binding.fileInfo.text =
                          "Windows executable selected."

                      binding.runButton.isEnabled = true

                      binding.status.text =
                          "Status: EXE ready"
                  }

              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)

                  binding =
                      ActivityMainBinding.inflate(layoutInflater)

                  setContentView(binding.root)

                  binding.selectButton.setOnClickListener {

                      pickExe.launch(
                          arrayOf(
                              "application/octet-stream",
                              "*/*"
                          )
                      )
                  }

                  binding.runButton.setOnClickListener {

                      binding.status.text =
                          "Status: Compatibility runtime required"

                      Toast.makeText(
                          this,
                          "EXE selected. A Windows compatibility runtime is needed to run it.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun getFileName(uri: Uri): String? {

                  contentResolver.query(
                      uri,
                      null,
                      null,
                      null,
                      null
                  )?.use { cursor ->

                      val index =
                          cursor.getColumnIndex(
                              OpenableColumns.DISPLAY_NAME
                          )

                      if (index >= 0 && cursor.moveToFirst()) {
                          return cursor.getString(index)
                      }
                  }

                  return uri.lastPathSegment
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: ExeRunner
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Runner-APK
          path: ExeRunner/app/build/outputs/apk/debug/app-debug.apk
