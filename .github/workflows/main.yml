name: Build EXE Runner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        run: |
          mkdir -p ExeRunner/app/src/main/java/com/exerunner/app
          mkdir -p ExeRunner/app/src/main/res/layout
          mkdir -p ExeRunner/app/src/main/res/values

          cat > ExeRunner/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ExeRunner"
          include(":app")
          EOF

          cat > ExeRunner/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > ExeRunner/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > ExeRunner/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.exerunner.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.exerunner.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > ExeRunner/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="EXE Runner">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > ExeRunner/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="EXE Runner"
                  android:textSize="32sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Choose an EXE file."
                  android:textSize="18sp" />

              <Button
                  android:id="@+id/choose"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="30dp"
                  android:text="CHOOSE EXE" />

              <Button
                  android:id="@+id/run"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="RUN EXE" />

          </LinearLayout>
          EOF

          cat > ExeRunner/app/src/main/java/com/exerunner/app/MainActivity.java <<'EOF'
          package com.exerunner.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.Button;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              TextView status;
              Uri file;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);

                  Button choose = findViewById(R.id.choose);
                  Button run = findViewById(R.id.run);

                  choose.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("*/*");
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(i, 1);
                  });

                  run.setOnClickListener(v -> {
                      if (file == null) {
                          status.setText("Choose an EXE first.");
                      } else {
                          status.setText(
                              "EXE selected. Windows compatibility engine coming next."
                          );
                      }
                  });
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == 1 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      file = data.getData();

                      if (file != null) {
                          status.setText("EXE selected!");
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ExeRunner
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Runner-APK
          path: ExeRunner/app/build/outputs/apk/debug/app-debug.apk
