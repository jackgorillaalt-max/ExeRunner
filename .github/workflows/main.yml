name: Build EXE Runner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create folders
        run: |
          mkdir -p ExeRunner/app/src/main/java/com/example/exerunner
          mkdir -p ExeRunner/app/src/main/res/layout
          mkdir -p ExeRunner/app/src/main/res/values

      - name: Create settings.gradle.kts
        run: |
          cat > ExeRunner/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ExeRunner"
          include(":app")
          EOF

      - name: Create build.gradle.kts
        run: |
          cat > ExeRunner/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > ExeRunner/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Create app build.gradle.kts
        run: |
          cat > ExeRunner/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.exerunner"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.exerunner"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > ExeRunner/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="EXE Runner"
                  android:theme="@style/Theme.ExeRunner">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create styles.xml
        run: |
          cat > ExeRunner/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ExeRunner"
                  parent="Theme.Material3.DayNight.NoActionBar">
              </style>
          </resources>
          EOF

      - name: Create activity_main.xml
        run: |
          cat > ExeRunner/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="EXE Runner"
                  android:textSize="30sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Choose a Windows EXE file."
                  android:textSize="18sp" />

              <Button
                  android:id="@+id/pickButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Choose EXE" />

              <Button
                  android:id="@+id/runButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="RUN EXE" />

          </LinearLayout>
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > ExeRunner/app/src/main/java/com/example/exerunner/MainActivity.kt <<'EOF'
          package com.example.exerunner

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.example.exerunner.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var selectedFile: Uri? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  binding.pickButton.setOnClickListener {

                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          type = "*/*"
                          addCategory(Intent.CATEGORY_OPENABLE)
                      }

                      startActivityForResult(intent, 100)
                  }

                  binding.runButton.setOnClickListener {

                      if (selectedFile == null) {

                          Toast.makeText(
                              this,
                              "Choose an EXE first.",
                              Toast.LENGTH_SHORT
                          ).show()

                      } else {

                          binding.statusText.text =
                              "EXE selected. Windows compatibility runtime required."

                      }
                  }
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (requestCode == 100 &&
                      resultCode == Activity.RESULT_OK) {

                      selectedFile = data?.data

                      binding.statusText.text =
                          selectedFile?.let {
                              "Selected: ${it.lastPathSegment}"
                          } ?: "No file selected."
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ExeRunner
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Runner-APK
          path: ExeRunner/app/build/outputs/apk/debug/app-debug.apk
