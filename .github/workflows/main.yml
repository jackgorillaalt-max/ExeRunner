name: Build EXE Runner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        run: |

          rm -rf ExeRunner

          mkdir -p ExeRunner/app/src/main/java/com/exerunner/app
          mkdir -p ExeRunner/app/src/main/res/layout
          mkdir -p ExeRunner/app/src/main/res/values

          cat > ExeRunner/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ExeRunner"

include(":app")
EOF

          cat > ExeRunner/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > ExeRunner/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
EOF

          cat > ExeRunner/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exerunner.app'

    compileSdk 35

    defaultConfig {
        applicationId 'com.exerunner.app'
        minSdk 26
        targetSdk 35

        versionCode 1
        versionName '1.0'
    }
}
EOF

          cat > ExeRunner/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:label="EXE Runner"
        android:theme="@android:style/Theme.Material.Light.NoActionBar">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>

                <action android:name="android.intent.action.MAIN" />

                <category android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > ExeRunner/app/src/main/res/layout/activity_main.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<LinearLayout
    xmlns:android="http://schemas.android.com/apk/res/android"

    android:layout_width="match_parent"
    android:layout_height="match_parent"

    android:orientation="vertical"
    android:padding="24dp">

    <TextView
        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:text="EXE Runner"
        android:textSize="32sp"
        android:textStyle="bold" />

    <TextView
        android:id="@+id/statusText"

        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:layout_marginTop="20dp"

        android:text="Choose a Windows EXE file."
        android:textSize="18sp" />

    <Button
        android:id="@+id/pickButton"

        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:layout_marginTop="30dp"

        android:text="CHOOSE EXE" />

    <Button
        android:id="@+id/runButton"

        android:layout_width="match_parent"
        android:layout_height="wrap_content"

        android:layout_marginTop="12dp"

        android:text="RUN EXE" />

</LinearLayout>
EOF

          cat > ExeRunner/app/src/main/java/com/exerunner/app/MainActivity.java <<'EOF'
package com.exerunner.app;

import android.app.Activity;
import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.widget.Button;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {

    private TextView statusText;

    private Uri selectedFile;

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        setContentView(R.layout.activity_main);

        statusText = findViewById(R.id.statusText);

        Button pickButton = findViewById(R.id.pickButton);

        Button runButton = findViewById(R.id.runButton);

        pickButton.setOnClickListener(v -> {

            Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);

            intent.setType("*/*");

            intent.addCategory(Intent.CATEGORY_OPENABLE);

            startActivityForResult(intent, 100);

        });

        runButton.setOnClickListener(v -> {

            if (selectedFile == null) {

                Toast.makeText(
                    this,
                    "Choose an EXE first.",
                    Toast.LENGTH_SHORT
                ).show();

                return;
            }

            statusText.setText(
                "EXE selected.\n\nWindows compatibility runtime will be added next."
            );

        });
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
            requestCode,
            resultCode,
            data
        );

        if (requestCode == 100 &&
            resultCode == RESULT_OK &&
            data != null) {

            selectedFile = data.getData();

            if (selectedFile != null) {

                statusText.setText(
                    "Selected:\n" + selectedFile.toString()
                );

            }
        }
    }
}
EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ExeRunner
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "APK FILES:"
          find ExeRunner -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXE-Runner-APK
          path: ExeRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
